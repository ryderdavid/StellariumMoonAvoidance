# Stellarium compatibility mapping for CI
# This file maps Stellarium releases to specific Qt/Toolchains

default: "25.3-qt6"

targets:
  25.3-qt6:
    stellarium_version: "25.3"
    qt:
      major: 6
      version: "6.8.3"
    macos:
      runner: "macos-14"
      arch: "arm64"
      deployment_target: "11.0"
    windows:
      arch: "win64_msvc2022_64"
      msvc:
        year: 2022
        toolset: "v143"
    notes: "Stellarium 25.3 with Qt 6.8.3"
