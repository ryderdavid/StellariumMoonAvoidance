name: Build Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Checkout Stellarium source
        uses: actions/checkout@v4
        with:
          repository: Stellarium/stellarium
          ref: v25.3
          path: stellarium-source
          fetch-depth: 1
          
      - name: Detect Stellarium's Qt version
        id: detect-qt
        run: |
          cd stellarium-source
          # Extract Qt version from Stellarium's CMakeLists.txt
          QT_VERSION=$(grep -E "find_package\(Qt6" CMakeLists.txt | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
          if [ -z "$QT_VERSION" ]; then
            # Fallback: check for VERSION or REQUIRED patterns
            QT_VERSION=$(grep -A5 "find_package(Qt6" CMakeLists.txt | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
          fi
          if [ -z "$QT_VERSION" ]; then
            echo "Could not detect Qt version, using 6.5.3 as fallback"
            QT_VERSION="6.5.3"
          fi
          echo "Detected Qt version: $QT_VERSION"
          echo "qt_version=$QT_VERSION" >> $GITHUB_OUTPUT
          
      - name: Install Qt and dependencies
        run: |
          # Install Qt via Homebrew (will get latest 6.x, which is fine for dynamic plugin)
          brew install qt@6 cmake ninja ccache glm
          
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-build-25.3
          max-size: 500M
          
      - name: Configure and Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DSTELROOT=stellarium-source \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Checkout Stellarium source
        uses: actions/checkout@v4
        with:
          repository: Stellarium/stellarium
          ref: v25.3
          path: stellarium-source
          fetch-depth: 1
          
      - name: Detect Stellarium's Qt version
        id: detect-qt
        shell: bash
        run: |
          cd stellarium-source
          # Extract Qt version from Stellarium's CMakeLists.txt
          QT_VERSION=$(grep -E "find_package\(Qt6" CMakeLists.txt | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
          if [ -z "$QT_VERSION" ]; then
            QT_VERSION=$(grep -A5 "find_package(Qt6" CMakeLists.txt | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
          fi
          if [ -z "$QT_VERSION" ]; then
            echo "Could not detect Qt version, using 6.5.3 as fallback"
            QT_VERSION="6.5.3"
          fi
          echo "Detected Qt version: $QT_VERSION"
          echo "qt_version=$QT_VERSION" >> $GITHUB_OUTPUT
          
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ steps.detect-qt.outputs.qt_version }}
          arch: win64_msvc2019_64
          cache: true
          
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          
      - name: Setup sccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows-build-25.3
          variant: sccache
          max-size: 500M
          
      - name: Configure and Build
        shell: cmd
        run: |
          cmake -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%QT_ROOT_DIR%" ^
            -DSTELROOT=stellarium-source ^
            -DCMAKE_C_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build build
