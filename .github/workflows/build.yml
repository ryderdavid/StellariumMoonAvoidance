name: Build Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install qt@6 cmake ninja ccache
          
      - name: Checkout Stellarium source (headers only)
        uses: actions/checkout@v4
        with:
          repository: Stellarium/stellarium
          ref: v25.3
          path: stellarium-source
          fetch-depth: 1
          
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-build-25.3
          max-size: 500M
          
      - name: Configure and Build
        run: |
          export PATH="/opt/homebrew/opt/qt@6/bin:$PATH"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="/opt/homebrew/opt/qt@6" \
            -DSTELROOT=stellarium-source \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build
          
      - name: Package
        run: |
          mkdir -p staging/MoonAvoidance
          cp build/libMoonAvoidance.dylib staging/MoonAvoidance/MoonAvoidance.dylib
          cp plugin.ini staging/MoonAvoidance/
          
          VERSION="dev-$(date +%Y%m%d-%H%M%S)"
          
          pkgbuild --root staging \
            --identifier org.stellarium.moonavoidance \
            --version "$VERSION" \
            --install-location "/Library/Application Support/Stellarium/modules" \
            MoonAvoidance-component.pkg
            
          productbuild --distribution installers/macos/Distribution.xml \
            --package-path . \
            --version "$VERSION" \
            "MoonAvoidance-${VERSION}-arm64.pkg"
            
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: MoonAvoidance-*-arm64.pkg
          retention-days: 7

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Checkout Stellarium source (headers only)
        uses: actions/checkout@v4
        with:
          repository: Stellarium/stellarium
          ref: v25.3
          path: stellarium-source
          fetch-depth: 1
          
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.*'
          arch: win64_msvc2019_64
          cache: true
          
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          
      - name: Setup sccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows-build-25.3
          variant: sccache
          max-size: 500M
          
      - name: Configure and Build
        shell: cmd
        run: |
          cmake -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%QT_ROOT_DIR%" ^
            -DSTELROOT=stellarium-source ^
            -DCMAKE_C_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build build
          
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y
          
      - name: Package
        shell: bash
        run: |
          cp build/MoonAvoidance.dll .
          cp plugin.ini .
          
          VERSION="dev-$(date +%Y%m%d-%H%M%S)"
          
          "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            /DMyAppVersion="$VERSION" \
            installers/windows/MoonAvoidance.iss
            
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installers/windows/Output/*.exe
          retention-days: 7
          
  cleanup-artifacts:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows]
    if: always()
    steps:
      - name: Remove old artifacts
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: '7 days'
          skip-recent: 3
          skip-tags: true
