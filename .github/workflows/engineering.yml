name: Engineering
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkpoint:
    name: checkpoint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned OpenSpec
        run: npm install --global @fission-ai/openspec@1.15.0
      - name: Exercise lifecycle failure and success paths
        shell: bash
        run: python -m unittest discover -s tools/engineering/tests -v
      - name: Validate PR evidence without private services
        shell: bash
        env:
          EXTERNAL_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Check the actual contributor revision, not GitHub's synthetic merge tree.
          git checkout --detach "$PR_HEAD"
          args=()
          if [ -n "$PR_BASE" ]; then args+=(--base "$PR_BASE"); fi
          if [ "$EXTERNAL_PR" = "true" ]; then args+=(--external); fi
          python tools/engineering/lifecycle.py ci "${args[@]}"
